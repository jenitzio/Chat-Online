# render.yaml

services:
  - type: web
    name: nexus-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MAX_ROOMS
        value: 100
      - key: MAX_USERS_PER_ROOM
        value: 12
