<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>NEXUS — Real-Time Platform</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>NEXUS</h1>
      <p>Real-time rooms, chat, canvas, and clicker game</p>
    </header>

    <main class="container">
      <!-- Home View -->
      <section id="homeView" class="card view active">
        <h2>Create or Join a Room</h2>

        <div class="grid two-cols">
          <div class="panel">
            <h3>Create Room</h3>
            <form id="createRoomForm">
              <label>
                Your name
                <input type="text" id="createUsername" maxlength="50" required />
              </label>

              <label>
                Room name
                <input type="text" id="roomName" maxlength="100" required />
              </label>

              <label>
                Room password
                <input type="password" id="roomPassword" minlength="4" required />
              </label>

              <button type="submit">Create Room</button>
            </form>
          </div>

          <div class="panel">
            <h3>Join Room</h3>
            <form id="lookupRoomForm">
              <label>
                Your name
                <input type="text" id="joinUsername" maxlength="50" required />
              </label>

              <label>
                Room slug or join code
                <input
                  type="text"
                  id="roomLookup"
                  placeholder="e.g. cosmic-nexus-1234 or ABC123"
                  required
                />
              </label>

              <button type="submit">Find Room</button>
            </form>
          </div>
        </div>

        <div id="homeMessage" class="message"></div>
      </section>

      <!-- Lobby View -->
      <section id="lobbyView" class="card view">
        <h2>Room Lobby</h2>

        <div class="room-summary">
          <p><strong>Name:</strong> <span id="lobbyRoomName">-</span></p>
          <p><strong>Slug:</strong> <span id="lobbyRoomSlug">-</span></p>
          <p><strong>Users:</strong> <span id="lobbyUserCount">0</span></p>
          <p><strong>Max users:</strong> <span id="lobbyMaxUsers">0</span></p>
        </div>

        <form id="validatePasswordForm">
          <label>
            Enter room password
            <input type="password" id="joinPassword" minlength="4" required />
          </label>

          <div class="actions">
            <button type="submit">Enter Room</button>
            <button type="button" id="backToHomeBtn" class="secondary">Back</button>
          </div>
        </form>

        <div id="lobbyMessage" class="message"></div>
      </section>

      <!-- Room View -->
      <section id="roomView" class="card view">
        <div class="room-header">
          <div>
            <h2 id="roomTitle">Room</h2>
            <p>
              Join code:
              <strong id="roomJoinCode">-</strong>
            </p>
          </div>
          <button id="leaveRoomBtn" class="secondary">Leave Room</button>
        </div>

        <div class="grid room-grid">
          <div class="panel">
            <h3>Users</h3>
            <ul id="userList" class="user-list"></ul>

            <div class="actions wrap">
              <button id="toggleAudioBtn">Mute Audio</button>
              <button id="toggleVideoBtn">Turn Off Video</button>
              <button id="sendReactionBtn" class="secondary">Send 🔥</button>
            </div>
          </div>

          <div class="panel">
            <h3>Chat</h3>
            <div id="chatMessages" class="chat-box"></div>

            <div id="typingIndicator" class="typing-indicator"></div>

            <form id="chatForm" class="chat-form">
              <input
                type="text"
                id="chatInput"
                placeholder="Type a message..."
                maxlength="500"
                autocomplete="off"
              />
              <button type="submit">Send</button>
            </form>
          </div>

          <div class="panel">
            <h3>Shared Canvas</h3>
            <canvas id="drawCanvas" width="700" height="300"></canvas>

            <div class="actions wrap">
              <button id="clearCanvasBtn" class="secondary">Clear Canvas</button>
            </div>
          </div>

          <div class="panel">
            <h3>Clicker Game</h3>
            <div id="clickerStatus">Not started</div>
            <div id="clickerScores" class="scores"></div>

            <div class="actions wrap">
              <button id="startClickerBtn">Start Game</button>
              <button id="clickerBtn">Click!</button>
            </div>
          </div>
        </div>

        <div id="roomMessage" class="message"></div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
